<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ChongzyStore</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(0, 140, 255, 0.18), transparent 35%),
                radial-gradient(circle at bottom right, rgba(140, 0, 255, 0.16), transparent 35%),
                #050810;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* BACKGROUND EFFECTS */

        .background-glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: rgba(0, 140, 255, 0.08);
            filter: blur(80px);
            top: -150px;
            left: -150px;
            pointer-events: none;
        }

        .background-glow.two {
            background: rgba(130, 0, 255, 0.08);
            top: auto;
            left: auto;
            bottom: -150px;
            right: -150px;
        }

        /* LOGIN CONTAINER */

        .login-container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 2;
        }

        .login-card {
            width: 100%;
            padding: 42px;
            border-radius: 24px;
            background: rgba(13, 18, 32, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
        }

        /* BRAND */

        .brand {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-icon {
            width: 74px;
            height: 74px;
            margin: 0 auto 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #0b84ff, #7b2cff);
            box-shadow:
                0 15px 35px rgba(0, 120, 255, 0.25);
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .brand h1 span {
            color: #3da5ff;
        }

        .brand p {
            margin-top: 8px;
            color: #8e9bb3;
            font-size: 14px;
        }

        /* ADMIN BADGE */

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 16px;
            padding: 7px 13px;
            border-radius: 999px;
            background: rgba(0, 140, 255, 0.10);
            border: 1px solid rgba(0, 140, 255, 0.20);
            color: #69b9ff;
            font-size: 12px;
            font-weight: 700;
        }

        .admin-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #29a7ff;
            box-shadow: 0 0 10px #29a7ff;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            color: #d9e1ef;
            font-size: 13px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #718096;
            font-size: 16px;
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            height: 54px;
            padding: 0 16px 0 45px;
            border-radius: 13px;
            border: 1px solid #252d3e;
            outline: none;
            background: #0a0f1c;
            color: white;
            font-size: 15px;
            transition: 0.25s ease;
        }

        .form-control::placeholder {
            color: #596579;
        }

        .form-control:focus {
            border-color: #218cff;
            box-shadow: 0 0 0 4px rgba(33, 140, 255, 0.10);
            background: #0c1220;
        }

        /* ERROR */

        .error-box {
            margin-bottom: 20px;
            padding: 13px 15px;
            border-radius: 12px;
            background: rgba(255, 60, 60, 0.08);
            border: 1px solid rgba(255, 80, 80, 0.25);
            color: #ff8c8c;
            font-size: 13px;
            line-height: 1.5;
        }

        /* BUTTON */

        .login-btn {
            width: 100%;
            height: 56px;
            margin-top: 4px;
            border: none;
            border-radius: 13px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            font-weight: 800;
            background: linear-gradient(135deg, #087fff, #6934ff);
            box-shadow: 0 12px 30px rgba(36, 102, 255, 0.22);
            transition: 0.25s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 35px rgba(36, 102, 255, 0.32);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* BACK LINK */

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #8290a8;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .back-link:hover {
            color: #55adff;
        }

        /* SECURITY NOTE */

        .security-note {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.07);
            text-align: center;
            color: #66738a;
            font-size: 11px;
            line-height: 1.6;
        }

        /* FOOTER */

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #4f5b70;
            font-size: 11px;
        }

        /* TABLET */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .login-card {
                padding: 32px 24px;
                border-radius: 20px;
            }

            .brand {
                margin-bottom: 30px;
            }

            .brand-icon {
                width: 66px;
                height: 66px;
                font-size: 28px;
            }

            .brand h1 {
                font-size: 25px;
            }
        }

        /* MOBILE */

        @media (max-width: 420px) {

            body {
                padding: 12px;
            }

            .login-card {
                padding: 28px 19px;
                border-radius: 18px;
            }

            .brand-icon {
                width: 60px;
                height: 60px;
                border-radius: 17px;
                font-size: 25px;
            }

            .brand h1 {
                font-size: 23px;
            }

            .brand p {
                font-size: 13px;
            }

            .form-control {
                height: 52px;
                font-size: 14px;
            }

            .login-btn {
                height: 53px;
            }

            .admin-badge {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <div class="background-glow"></div>
    <div class="background-glow two"></div>

    <div class="login-container">

        <div class="login-card">

            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    CZ
                </div>

                <h1>
                    Chongzy<span>Store</span>
                </h1>

                <p>
                    Secure Store Administration
                </p>

                <div class="admin-badge">
                    <span class="admin-dot"></span>
                    ADMIN PANEL
                </div>

            </div>


            <!-- ERROR MESSAGE -->

            {% if error %}

                <div class="error-box">
                    ⚠️ {{ error }}
                </div>

            {% endif %}


            <!-- LOGIN FORM -->

            <form method="POST" action="{{ url_for('admin_login') }}">

                <div class="form-group">

                    <label for="username">
                        Admin Username
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter admin username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Admin Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter admin password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    🔐 Access Admin Dashboard
                </button>

            </form>


            <!-- BACK TO STORE -->

            <a
                href="{{ url_for('home') }}"
                class="back-link"
            >
                ← Back to ChongzyStore
            </a>


            <div class="security-note">
                🔒 Authorized administration only.<br>
                Keep your administrator credentials private.
            </div>

        </div>


        <div class="footer">
            © 2026 ChongzyStore · Admin Portal
        </div>

    </div>

</body>
</html>
