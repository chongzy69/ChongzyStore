<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Request Submitted | ChongzyStore
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #0f172a,
                    #020617
                );

            color: white;

            padding: 20px;
        }


        .card {

            width: 100%;

            max-width: 600px;

            text-align: center;

            padding: 45px 30px;

            border-radius: 25px;

            background: #0f172a;

            border:
                1px solid
                rgba(56,189,248,.15);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,.5);
        }


        .icon {

            font-size: 65px;

            margin-bottom: 20px;
        }


        h1 {

            color: #4ade80;

            margin-bottom: 15px;
        }


        p {

            color: #94a3b8;

            line-height: 1.7;
        }


        .account {

            margin: 25px 0;

            padding: 18px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.04);
        }


        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 25px;
        }


        .button {

            flex: 1;

            padding: 14px;

            border-radius: 11px;

            text-decoration: none;

            font-weight: 800;

            color: white;

            background: #2563eb;
        }


        .whatsapp {

            background: #16a34a;
        }


        @media(max-width:550px) {

            .buttons {

                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="card">


    <div class="icon">
        ✅
    </div>


    <h1>
        Request Submitted!
    </h1>


    <p>

        Your purchase request has been
        successfully received.

        ChongzyStore will contact you shortly
        to confirm the account and payment.

    </p>


    <div class="account">

        <strong>
            {{ account.title }}
        </strong>

        <br><br>

        ₹{{ "%.2f"|format(account.price) }}

    </div>


    <div class="buttons">


        <a
            href="{{ url_for('home') }}"
            class="button"
        >
            🏠 Home
        </a>


        <a
            href="https://wa.me/919863060164"
            target="_blank"
            class="button whatsapp"
        >
            💬 WhatsApp
        </a>


    </div>


</div>


</body>

</html>
