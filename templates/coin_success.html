<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coins Added - ChongzyStore</title>

    <style>

        body {

            margin: 0;

            min-height: 100vh;

            background: #050505;

            color: white;

            font-family: Arial, sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

        .box {

            width: 100%;

            max-width: 500px;

            background: #111;

            border: 1px solid #3d320f;

            border-radius: 20px;

            padding: 40px 30px;

            text-align: center;

        }

        .check {

            width: 80px;

            height: 80px;

            border-radius: 50%;

            background: #f5c542;

            color: #111;

            font-size: 45px;

            font-weight: bold;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 20px;

        }

        h1 {

            color: #f5c542;

        }

        .coins {

            margin: 30px 0;

            padding: 25px;

            background: #090909;

            border-radius: 15px;

            border: 1px solid #3d320f;

        }

        .number {

            color: #f5c542;

            font-size: 45px;

            font-weight: bold;

        }

        .balance {

            margin-top: 15px;

            color: #aaa;

        }

        .balance strong {

            color: white;

        }

        a {

            display: block;

            margin-top: 15px;

            padding: 15px;

            border-radius: 10px;

            text-decoration: none;

            font-weight: bold;

        }

        .primary {

            background: #f5c542;

            color: #111;

        }

        .secondary {

            background: #1c1c1c;

            color: white;

            border: 1px solid #333;

        }

    </style>

</head>


<body>


<div class="box">


    <div class="check">
        ✓
    </div>


    <h1>
        Payment Successful!
    </h1>


    <p>
        Your coins have been added successfully.
    </p>


    <div class="coins">

        <div class="number">
            +{{ transaction.coins }}
        </div>

        <div>
            Coins Added
        </div>

        <div class="balance">

            Wallet Balance:

            <strong>
                {{ user.coins }} Coins
            </strong>

        </div>

    </div>


    <a
        href="{{ url_for('customer_dashboard') }}"
        class="primary"
    >
        Go to My Account
    </a>


    <a
        href="{{ url_for('add_coins') }}"
        class="secondary"
    >
        Add More Coins
    </a>


    <a
        href="{{ url_for('home') }}"
        class="secondary"
    >
        Back to Home
    </a>


</div>


</body>

</html>
