<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Account - ChongzyStore</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #020617;
            color: white;
        }

        .navbar {
            background: #0f172a;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            color: #22d3ee;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo span {
            color: white;
        }

        .back {
            color: #94a3b8;
            text-decoration: none;
        }

        .back:hover {
            color: #38bdf8;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: #0f172a;
            padding: 35px;
            border-radius: 20px;
            border: 1px solid #1e293b;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }

        h1 {
            margin-top: 0;
            color: #38bdf8;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .status {
            background: #172554;
            color: #7dd3fc;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full {
            grid-column: 1 / 3;
        }

        label {
            display: block;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #020617;
            color: white;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .current-image {
            margin-top: 15px;
            width: 300px;
            max-width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #334155;
        }

        .save-button {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                #0284c7,
                #2563eb
            );
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(37,99,235,.3);
        }

        .image-note {
            color: #64748b;
            font-size: 12px;
            margin-top: 8px;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: 1;
            }

            .navbar {
                padding: 18px 20px;
            }

            .container {
                margin-top: 25px;
            }

            .card {
                padding: 22px;
            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <a
        href="{{ url_for('admin_dashboard') }}"
        class="logo"
    >
        Chongzy<span>Store</span>
    </a>

    <a
        href="{{ url_for('admin_dashboard') }}"
        class="back"
    >
        ← Back to Dashboard
    </a>

</nav>


<div class="container">

    <div class="card">

        <h1>
            ✏️ Edit MLBB Account
        </h1>

        <p class="subtitle">
            Update the account information below.
        </p>


        <div class="status">

            Current Status:
            <strong>
                {{ account.status }}
            </strong>

        </div>


        <form
            method="POST"
            enctype="multipart/form-data"
        >


            <div class="form-grid">


                <!-- ACCOUNT TITLE -->

                <div class="full">

                    <label>
                        Account Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        value="{{ account.title }}"
                        required
                    >

                </div>


                <!-- INR PRICE -->

                <div>

                    <label>
                        Price (INR)
                    </label>

                    <input
                        type="number"
                        name="price"
                        step="0.01"
                        value="{{ account.price }}"
                        required
                    >

                </div>


                <!-- USD PRICE -->

                <div>

                    <label>
                        Price (USD)
                    </label>

                    <input
                        type="number"
                        name="usd_price"
                        step="0.01"
                        value="{{ account.usd_price }}"
                        required
                    >

                </div>


                <!-- RANK -->

                <div>

                    <label>
                        Rank
                    </label>

                    <input
                        type="text"
                        name="rank"
                        value="{{ account.rank or '' }}"
                    >

                </div>


                <!-- LEVEL -->

                <div>

                    <label>
                        Level
                    </label>

                    <input
                        type="text"
                        name="level"
                        value="{{ account.level or '' }}"
                    >

                </div>


                <!-- SKINS -->

                <div>

                    <label>
                        Skins
                    </label>

                    <input
                        type="text"
                        name="skins"
                        value="{{ account.skins or '' }}"
                    >

                </div>


                <!-- HEROES -->

                <div>

                    <label>
                        Heroes
                    </label>

                    <input
                        type="text"
                        name="heroes"
                        value="{{ account.heroes or '' }}"
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="full">

                    <label>
                        Account Description
                    </label>

                    <textarea
                        name="description"
                    >{{ account.description or '' }}</textarea>

                </div>


                <!-- NEW IMAGE -->

                <div class="full">

                    <label>
                        Replace Account Screenshot
                    </label>

                    <input
                        type="file"
                        name="image"
                        accept="image/*"
                    >

                    <div class="image-note">
                        Leave this empty if you do not want to
                        change the current screenshot.
                    </div>


                    {% if account.image %}

                    <img
                        src="{{ url_for('static', filename='uploads/' + account.image) }}"
                        class="current-image"
                        alt="Current Account Screenshot"
                    >

                    {% endif %}

                </div>


            </div>


            <button
                type="submit"
                class="save-button"
            >
                💾 Save Account Changes
            </button>


        </form>

    </div>

</div>


</body>

</html>
